name: DB Init & Seed

on:
  push:
    branches: [main, feat/iot-agent-db-ops]
  pull_request:
    branches: [main, feat/iot-agent-db-ops]
   

env:
  KUBECONFIG: /etc/rancher/k3s/k3s.yaml

jobs:
  db-init:
    name: "Deploy DB init job (${{ github.event.inputs.environment || (github.event_name == 'pull_request' && 'sbx' || 'dev') }})"
    runs-on: [self-hosted, iot-agent-local]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Resolve environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ENV="sbx"
          else
            ENV="dev"
          fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          echo "namespace=iotag-$ENV" >> "$GITHUB_OUTPUT"

      - name: Helm upgrade --install db-ops
        run: |
          bash ./scripts/install-postgres.sh ${{ steps.env.outputs.name }}

      - name: Populate DB
        run: |
          kubectl exec -n iotag-${{ steps.env.outputs.namespace }} -it \
            -l app=iot-agent-db-ops-init -- \
            psql -U gte -d iot_agent < /sql/00-schema.sql

          kubectl exec -n iotag-${{ steps.env.outputs.namespace }} -it \
            -l app=iot-agent-db-ops-init -- \
            psql -U gte -d iot_agent < /sql/10-seed-dev.sql